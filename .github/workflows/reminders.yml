name: WhatsApp reminders cron

on:
  schedule:
    # Every 30 minutes. GitHub may delay by a few minutes under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          BASE_URL: ${{ secrets.BOT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing BOT_BASE_URL or CRON_SECRET secret" >&2
            exit 1
          fi
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/reminders"
