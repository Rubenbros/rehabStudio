name: WhatsApp reminders cron

on:
  schedule:
    # Every 30 minutes. Picks up day-before reminders, follow-ups and stale
    # pending approvals on every tick.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          BASE_URL: ${{ secrets.BOT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping: BOT_BASE_URL or CRON_SECRET secret is missing. Add them at"
            echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 0
          fi
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/reminders"
