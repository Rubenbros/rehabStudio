name: Deploy to Cloud Run

# Despliegue de producción a Google Cloud Run (europe-west1).
# Este workflow solo construye la imagen y la despliega. Requiere que el runbook
# de primer despliegue manual haya creado: repo de Artifact Registry, Service
# Accounts (deploy y runtime), Workload Identity Federation y los secretos en
# Secret Manager (nombre del secreto = nombre de la variable en MAYÚSCULAS).
# La SA de runtime necesita además roles/cloudsql.client en el proyecto de la
# instancia de Cloud SQL y roles/aiplatform.user para llamar a Vertex AI
# (Gemini) por ADC — el bot no usa API keys de LLM.

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: {}

# WIF (OIDC) necesita id-token; checkout necesita contents.
permissions:
  contents: read
  id-token: write

# No solapar despliegues del mismo servicio; encola sin cancelar el que corre.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  GCP_REGION: europe-west1
  AR_HOST: europe-west1-docker.pkg.dev
  SERVICE: rehab-studio
  # Instancia de Cloud SQL compartida del workspace (PostgreSQL 17).
  CLOUDSQL_INSTANCE: t800labsweb:europe-west1:t800labs-pg

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Entorno de GitHub 'production' (permite añadir reglas de aprobación luego).
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar en GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login de Docker en Artifact Registry
        run: gcloud auth configure-docker "${AR_HOST}" --quiet

      - name: Build y push de la imagen
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${SERVICE}"
          # Los NEXT_PUBLIC_* se INLINEAN en 'next build' → deben ir como build args.
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Desplegar en Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --image "${IMAGE}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --port 8080 \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 80 \
            --timeout 120 \
            --cpu-boost \
            --add-cloudsql-instances "${CLOUDSQL_INSTANCE}" \
            --set-env-vars "NODE_ENV=production,NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }},TWILIO_ACCOUNT_SID=${{ vars.TWILIO_ACCOUNT_SID }},TWILIO_WHATSAPP_FROM=${{ vars.TWILIO_WHATSAPP_FROM }},GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},VERTEX_LOCATION=${{ vars.VERTEX_LOCATION }},GEMINI_MODEL=${{ vars.GEMINI_MODEL }},GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }},GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }},GOOGLE_CALENDAR_ID=${{ vars.GOOGLE_CALENDAR_ID }},OWNER_PHONE=${{ vars.OWNER_PHONE }},OWNER_EMAIL=${{ vars.OWNER_EMAIL }},CLINIC_NAME=${{ vars.CLINIC_NAME }},CLINIC_TIMEZONE=${{ vars.CLINIC_TIMEZONE }},CLINIC_ADDRESS=${{ vars.CLINIC_ADDRESS }},SESSION_PRICE_EUR=${{ vars.SESSION_PRICE_EUR }},FOLLOWUP_PRICE_EUR=${{ vars.FOLLOWUP_PRICE_EUR }}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_REFRESH_TOKEN=GOOGLE_REFRESH_TOKEN:latest,CRON_SECRET=CRON_SECRET:latest,MCP_BEARER_TOKEN=MCP_BEARER_TOKEN:latest"

      - name: URL del servicio
        run: |
          gcloud run services describe "${SERVICE}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${GCP_REGION}" \
            --format 'value(status.url)'
