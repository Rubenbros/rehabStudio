# ---------------------------------------------------------------------------
# DESPLIEGUE de producción a Google Cloud Run (europe-west1) — The Rehab Studio
#
# Sustituye a .github/workflows/deploy-cloudrun.yml (conservado en
# .github/workflows-legacy/ hasta que el primer build real pase en verde).
# Motivo del cambio: ninguna credencial sale de Google y no dependemos de
# GitHub para ejecutar nada; GitHub solo notifica el push.
#
# Requisitos previos (runbook de primer despliegue, ya cumplidos):
#   - Repo de Artifact Registry `rehab-studio` en europe-west1.
#   - SA de runtime rehab-studio-run@ con roles/cloudsql.client y
#     roles/aiplatform.user (Vertex AI por ADC; el bot no usa API keys de LLM).
#   - Secretos en Secret Manager (nombre del secreto = nombre de la env var).
#
# PERMISOS que necesita la SA de build (cloudbuild-deployer@, ya creada):
#   roles/artifactregistry.writer      (push de la imagen)
#   roles/run.admin                    (gcloud run deploy + describe)
#   roles/iam.serviceAccountUser       sobre rehab-studio-run@ (--service-account)
#   roles/secretmanager.secretAccessor (referenciar los secretos en --set-secrets)
#   roles/logging.logWriter            (obligatorio al usar SA propia)
#   roles/storage.admin                (bucket de staging de `builds submit`)
#   NOTA: cloudsql.client NO hace falta aquí — el build no toca la base de
#   datos; ese rol lo necesita la SA de runtime, no la de build.
#
# LANZAR A MANO (ver README.md → Deployment):
#   gcloud builds submit --config cloudbuild.yaml --region=europe-west1 \
#     --project=rehab-studio-web \
#     --substitutions=COMMIT_SHA="$(git rev-parse HEAD)"
# ---------------------------------------------------------------------------

# Con SA propia, options.logging: CLOUD_LOGGING_ONLY es OBLIGATORIO (si no, el
# build falla al arrancar con "service account must specify a logs bucket").
serviceAccount: 'projects/rehab-studio-web/serviceAccounts/cloudbuild-deployer@rehab-studio-web.iam.gserviceaccount.com'

# Configuración NO secreta, versionada y auditable (antes vivía invisible en los
# `vars` del repo de GitHub). Los secretos NUNCA van aquí: se referencian por
# nombre en --set-secrets y los resuelve Cloud Run en arranque con la SA de
# runtime, que es la que tiene secretmanager.secretAccessor.
substitutions:
  _PROJECT_ID: 'rehab-studio-web'
  _REGION: 'europe-west1'
  _AR_HOST: 'europe-west1-docker.pkg.dev'
  _AR_REPO: 'rehab-studio'
  _SERVICE: 'rehab-studio'
  _RUNTIME_SA: 'rehab-studio-run@rehab-studio-web.iam.gserviceaccount.com'
  # Instancia de Cloud SQL compartida del workspace (PostgreSQL 17).
  _CLOUDSQL_INSTANCE: 't800labsweb:europe-west1:t800labs-pg'
  # Se INLINEA en `next build` (build arg) y además va como env var del servicio.
  _NEXT_PUBLIC_SITE_URL: 'https://therehabstudio.es'
  _VERTEX_LOCATION: 'europe-west1'
  _GEMINI_MODEL: 'google/gemini-2.5-flash'
  _GOOGLE_CLIENT_ID: '435724820001-bmcp96fi48b4jujfud8aklsfo6m064l9.apps.googleusercontent.com'
  _GOOGLE_REDIRECT_URI: 'https://therehabstudio.es/api/google/oauth/callback'
  _GOOGLE_CALENDAR_ID: 'primary'
  _CLINIC_NAME: 'The Rehab Studio'
  _CLINIC_TIMEZONE: 'Europe/Madrid'
  _SESSION_PRICE_EUR: '60'
  _FOLLOWUP_PRICE_EUR: '30'
  # --- Sin valor real todavía. En los `vars` de GitHub figuraban como el
  # marcador literal "PENDIENTE"; aquí se dejan VACÍOS para que nadie confunda
  # un marcador con configuración. Rellenar cuando existan los datos reales.
  _TWILIO_ACCOUNT_SID: ''
  _TWILIO_WHATSAPP_FROM: ''
  _OWNER_PHONE: ''
  _OWNER_EMAIL: ''
  _CLINIC_ADDRESS: ''

steps:
  # 1) La trazabilidad revisión<->commit depende de $COMMIT_SHA, que viene
  #    VACÍO en builds lanzados a mano. Fallar aquí, ruidosamente, en lugar de
  #    publicar una imagen sin etiqueta de commit.
  - id: 'exigir-commit-sha'
    name: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        SHA="${COMMIT_SHA}"
        if [ -z "$$SHA" ]; then
          echo "ERROR: COMMIT_SHA está vacío (build manual)." >&2
          echo "Relanza con --substitutions=COMMIT_SHA=<sha del commit>" >&2
          exit 1
        fi
        echo "Desplegando el commit $$SHA"

  # 2) Build de la imagen. Los NEXT_PUBLIC_* se INLINEAN en `next build` -> van
  #    como build arg, no solo como env var del servicio. El builder de docker
  #    de Cloud Build ya viene autenticado contra Artifact Registry, así que el
  #    `gcloud auth configure-docker` del workflow viejo sobra.
  - id: 'build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}'
      - '-t'
      - '${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}'
      - '-t'
      - '${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest'
      - '.'

  # 3) Push explícito ANTES de desplegar (el bloque `images:` empuja al final
  #    del build, demasiado tarde para `gcloud run deploy`).
  - id: 'push-sha'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}']

  - id: 'push-latest'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest']

  # 4) Despliegue. Mismas banderas, mismo orden y mismos valores que el
  #    workflow de GitHub Actions.
  #    OJO: --set-env-vars y --set-secrets son SET, no update: esta lista es la
  #    fuente de verdad del servicio; lo que no esté aquí se BORRA.
  #    Se usa el delimitador propio `^|^` en lugar de comas: CLINIC_ADDRESS es
  #    una dirección postal y en cuanto tenga valor real llevará comas, que
  #    gcloud interpretaría como separador. El resultado es idéntico.
  - id: 'deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run deploy "${_SERVICE}" \
          --project "${_PROJECT_ID}" \
          --image "${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}" \
          --region "${_REGION}" \
          --platform managed \
          --port 8080 \
          --service-account "${_RUNTIME_SA}" \
          --allow-unauthenticated \
          --cpu 1 \
          --memory 512Mi \
          --min-instances 0 \
          --max-instances 2 \
          --concurrency 80 \
          --timeout 120 \
          --cpu-boost \
          --add-cloudsql-instances "${_CLOUDSQL_INSTANCE}" \
          --set-env-vars "^|^NODE_ENV=production|NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}|TWILIO_ACCOUNT_SID=${_TWILIO_ACCOUNT_SID}|TWILIO_WHATSAPP_FROM=${_TWILIO_WHATSAPP_FROM}|GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}|VERTEX_LOCATION=${_VERTEX_LOCATION}|GEMINI_MODEL=${_GEMINI_MODEL}|GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}|GOOGLE_REDIRECT_URI=${_GOOGLE_REDIRECT_URI}|GOOGLE_CALENDAR_ID=${_GOOGLE_CALENDAR_ID}|OWNER_PHONE=${_OWNER_PHONE}|OWNER_EMAIL=${_OWNER_EMAIL}|CLINIC_NAME=${_CLINIC_NAME}|CLINIC_TIMEZONE=${_CLINIC_TIMEZONE}|CLINIC_ADDRESS=${_CLINIC_ADDRESS}|SESSION_PRICE_EUR=${_SESSION_PRICE_EUR}|FOLLOWUP_PRICE_EUR=${_FOLLOWUP_PRICE_EUR}" \
          --set-secrets "DATABASE_URL=DATABASE_URL:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_REFRESH_TOKEN=GOOGLE_REFRESH_TOKEN:latest,CRON_SECRET=CRON_SECRET:latest,MCP_BEARER_TOKEN=MCP_BEARER_TOKEN:latest"

  # 5) URL del servicio (igual que el workflow: solo informa, no valida).
  - id: 'url'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run services describe "${_SERVICE}" \
          --project "${_PROJECT_ID}" \
          --region "${_REGION}" \
          --format 'value(status.url)'

# Registra la imagen en la ficha del build.
images:
  - '${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}'
  - '${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Hoy el pipeline tarda ~2m20s (el 70 % es el docker build sin caché). 30 min
# dejan margen de sobra ante lentitud de deb.debian.org o registry.npmjs.org.
timeout: '1800s'
